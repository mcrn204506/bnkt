<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f1ec">
  <title>分割ツール</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="mark">□</div>
      <div>
        <p class="eyebrow">IMAGE TOOL</p>
        <h1>分割ツール</h1>
        <p class="sub">画像を好きな数に分割できます。</p>
      </div>
    </header>

    <section class="panel">
      <div class="section-heading"><span class="step">01</span><div><h2>画像を選ぶ</h2><p>分割したい画像を読み込んでください。</p></div></div>
      <label class="upload" for="imageInput">
        <span class="upload-icon">＋</span><strong>画像を選択する</strong><small>JPG・PNG・WEBP</small>
      </label>
      <input id="imageInput" type="file" accept="image/*" hidden>
      <p id="fileName" class="file-name">まだ画像が選択されていません</p>
    </section>

    <section class="panel">
      <div class="section-heading"><span class="step">02</span><div><h2>分割方法</h2><p>縦または横の一方向に分割します。</p></div></div>
      <div class="mode-switch">
        <button class="mode active" data-mode="vertical" type="button">縦に分割</button>
        <button class="mode" data-mode="horizontal" type="button">横に分割</button>
      </div>
      <div class="count-row">
        <label for="count">分割する数</label>
        <div class="counter"><button id="minus" type="button" aria-label="減らす">−</button><output id="countValue">3</output><button id="plus" type="button" aria-label="増やす">＋</button></div>
      </div>
      <input id="count" type="range" min="2" max="20" value="3">
      <div class="range-labels"><span>2個</span><span>20個</span></div>
    </section>

    <section class="panel">
      <div class="section-heading"><span class="step">03</span><div><h2>プレビュー・共有</h2><p>画像ごとの「共有・保存」から保存先を選べます。</p></div></div>
      <div id="emptyState" class="empty-state"><span>✳</span><p>画像を選ぶと、分割した画像がここに表示されます。</p></div>
      <div id="previewArea" hidden><div id="previewGrid" class="preview-grid"></div></div>
      <p class="share-note">iPhoneでは「共有・保存」を押して、共有メニューから「画像を保存」などを選んでね。</p>
    </section>
    <footer>画像は端末内で処理されます</footer>
  </main>
</body>
</html>
